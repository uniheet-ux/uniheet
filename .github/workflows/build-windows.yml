name: Build Windows Installer
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish Windows app
        run: dotnet publish app/UniversityLibraryPOS.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - name: Build installer
        shell: powershell
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: UniversityLibraryPOS-Windows
          path: installer-output/UniversityLibraryPOS-Setup.exe
          if-no-files-found: error
